# Configuration Nginx de PRODUCTION pour CertiSign
# Sers le frontend Vue.js statiquement et utilise Gunicorn pour les backends.

# Upstreams pour les services backend (Gunicorn)
# Pas d'upstream pour le frontend, il est servi statiquement.

upstream django_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream api_gateway_backend {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream cert_backend {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream signature_backend {
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name ppd.camgovca.cm;

    ssl_certificate /etc/nginx/ssl/certisign/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/certisign/key.pem;

    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }

    # Configurations SSL et Headers de sécurité (inchangés)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;
    client_body_timeout 120s;

    # Optimisations proxy (inchangées)
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Headers proxy (inchangés)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- MODIFICATIONS POUR LA PRODUCTION ---

    # Racine pour les fichiers statiques du frontend
    root /home/ssatl/Documents/Doc@uthANTIC/frontend/dist;

    # ROUTE PRINCIPALE : Frontend Vue.js (servi statiquement)
    location / {
        try_files $uri $uri/ /index.html;
        # Ajout d'un cache pour les assets statiques
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- FIN DES MODIFICATIONS ---

    # Les autres routes restent en proxy vers Gunicorn

    location /api/ {
        proxy_pass http://django_backend;
    }

    location /admin/ {
        proxy_pass http://django_backend;
    }

    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://api_gateway_backend;
    }

    location /cert/ {
        rewrite ^/cert/(.*)$ /$1 break;
        proxy_pass http://cert_backend;
    }

    location /sign/ {
        rewrite ^/sign/(.*)$ /$1 break;
        proxy_pass http://signature_backend;
        # Timeouts longs spécifiques pour la signature
        proxy_connect_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /media/ {
        proxy_pass http://django_backend;
    }

    location /static/ {
        proxy_pass http://django_backend;
    }
    
    location = /favicon.ico { 
        log_not_found off; 
        access_log off; 
    }

    # Page d'erreur
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    access_log /var/log/nginx/certisign_prod_access.log;
    error_log /var/log/nginx/certisign_prod_error.log;
}
