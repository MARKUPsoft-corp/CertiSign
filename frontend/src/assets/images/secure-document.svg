<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 300 400">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="signatureGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Document Background -->
  <rect x="20" y="20" width="260" height="360" rx="15" ry="15" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Document Header -->
  <rect x="20" y="20" width="260" height="60" rx="15" ry="15" fill="#2E8B57"/>
  
  <!-- Document Lines -->
  <rect x="40" y="100" width="220" height="10" rx="5" ry="5" fill="#eeeeee"/>
  <rect x="40" y="130" width="150" height="10" rx="5" ry="5" fill="#eeeeee"/>
  <rect x="40" y="160" width="220" height="10" rx="5" ry="5" fill="#eeeeee"/>
  <rect x="40" y="190" width="180" height="10" rx="5" ry="5" fill="#eeeeee"/>
  
  <!-- Signature Line -->
  <rect x="40" y="260" width="150" height="3" rx="1.5" ry="1.5" fill="url(#signatureGradient)"/>
  
  <!-- Stamp/Seal -->
  <g transform="translate(220, 270) scale(1.5)">
    <circle cx="0" cy="0" r="20" fill="#2E8B57" opacity="0.7"/>
    <path d="M-10,0 L-3,7 L10,-6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
