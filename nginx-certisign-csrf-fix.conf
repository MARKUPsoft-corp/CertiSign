# Configuration Nginx pour CertiSign
# Ce fichier dit à Nginx comment rediriger les requêtes vers nos services

server {
    # Écouter sur le port 80 (HTTP) et 443 (HTTPS)
    listen 80;
    listen 443 ssl;
    
    # Nom du serveur (votre adresse IP)
    server_name 192.168.4.131;
    
    # Configuration SSL (certificats pour HTTPS)
    ssl_certificate /etc/nginx/ssl/certisign/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/certisign/key.pem;
    
    # Redirection automatique HTTP vers HTTPS
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }
    
    # Configuration SSL sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Headers de sécurité
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Gestion des gros fichiers (pour les PDFs)
    client_max_body_size 50M;
    
    # ROUTE PRINCIPALE : Frontend Vue.js
    # Quand on tape juste 192.168.4.131, on va vers le frontend
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support WebSocket (si besoin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # ROUTE API : Django Backend
    # 192.168.4.131/api/ → Django sur port 8000
    location /api/ {
        proxy_pass https://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support CSRF pour Django
        proxy_set_header X-CSRFToken $cookie_csrftoken;
        proxy_cookie_path / /;
    }
    
    # ROUTE ADMIN : Django Admin
    # 192.168.4.131/admin/ → Django Admin
    location /admin/ {
        proxy_pass https://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE GATEWAY : API Gateway FastAPI
    # 192.168.4.131/gateway/ → API Gateway sur port 8001
    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass https://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE DIRECTE : Échange de clés Diffie-Hellman
    # 192.168.4.131/dh-exchange/ → API Gateway sur port 8001
    location /dh-exchange/ {
        proxy_pass https://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE CERTIFICATS : Microservice Certificats
    # 192.168.4.131/cert/ → Microservice Certificats sur port 8002
    location /cert/ {
        rewrite ^/cert/(.*)$ /$1 break;
        proxy_pass https://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE SIGNATURE : Microservice Signature
    # 192.168.4.131/sign/ → Microservice Signature sur port 8003
    location /sign/ {
        rewrite ^/sign/(.*)$ /$1 break;
        proxy_pass https://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE MEDIA : Fichiers uploadés (PDFs, images)
    # 192.168.4.131/media/ → Fichiers média Django
    location /media/ {
        proxy_pass https://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ROUTE STATIC : Fichiers statiques (CSS, JS, images)
    # 192.168.4.131/static/ → Fichiers statiques Django
    location /static/ {
        proxy_pass https://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Gestion du favicon (icône du site)
    location /favicon.ico {
        proxy_pass https://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    
    # Logs pour debug
    access_log /var/log/nginx/certisign_access.log;
    error_log /var/log/nginx/certisign_error.log;
} 